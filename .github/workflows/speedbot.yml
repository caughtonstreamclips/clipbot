name: speedbot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: speedbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: (command -v ffmpeg >/dev/null && fc-list | grep -qi dejavu) || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core)

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache caption model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en

      - name: Run Speed bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: pip install -U yt-dlp && python speedbot.py

      - name: Save which streams were done
        run: |
          git config user.name "speedbot"
          git config user.email "speedbot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "update speed streams" && git pull --rebase && git push)
